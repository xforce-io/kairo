    {% if extract_errors %}<div class="ref-blocks" role="alert">{{ t('knowledge.extract_failed') }}{% for item in extract_errors %}<div>{{ t('knowledge.source_kind_' ~ item.source_kind) }}: {{ item.path }} <form method="post" action="/w/{{ selected_slug|urlencode }}/knowledge/extract?queue={{ knowledge_queue }}&amp;filter={{ knowledge_filter|urlencode }}" style="display:inline"><input type="hidden" name="path" value="{{ item.path }}"><input type="hidden" name="source_kind" value="{{ item.source_kind }}"><button class="btn btn-ghost btn-regen">{{ t('knowledge.retry_extract') }}</button></form></div>{% endfor %}</div>{% endif %}
{% if not extract_errors %}<p>{{ t("queue.empty") }}</p>{% endif %}
