{% for r in refs %}
<a class="nav-doc is-ref" href="/w/{{ slug | urlencode }}?ref={{ r.id | urlencode }}" hx-get="/w/{{ slug | urlencode }}/ref/{{ r.id }}" hx-target="#meta" hx-push-url="/w/{{ slug | urlencode }}?ref={{ r.id | urlencode }}">
  <span class="name">{{ r.title }}</span>
</a>
{% endfor %}
