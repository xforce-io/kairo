{% for tgt in targets %}
<a class="nav-doc{% if select_target == tgt.path %} is-active{% endif %}" href="/w/{{ slug | urlencode }}?target={{ tgt.path | urlencode }}" hx-get="/w/{{ slug | urlencode }}/target?path={{ tgt.path | urlencode }}" hx-target="#meta">
  <span class="dot {% if tgt.status == 'blocked' %}blocked{% elif tgt.status == 'missing' %}stale{% else %}ok{% endif %}"></span>
  <span class="name">{{ tgt.path }}</span>
</a>
{% endfor %}
